  />
  <!-- "DE" — ISO 3166-1 alpha-2 code for Germany -->
  <text
    x="32" y="25"
    font-family="Arial, 'Helvetica Neue', sans-serif"
    font-size="16"
    font-weight="800"
    fill="#f0b429"

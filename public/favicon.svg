<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- App background -->
  <rect width="64" height="64" rx="14" fill="#18181b"/>
  <!-- Speech bubble: rounded rect body + center-bottom tail -->
  <path
    d="M7 13 Q7 5 15 5 H49 Q57 5 57 13 V36 Q57 44 49 44 H38 L32 56 L26 44 H15 Q7 44 7 36 Z"
    fill="#f0b429"
